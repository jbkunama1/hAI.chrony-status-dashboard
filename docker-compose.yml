version: '3.8'

services:
  chrony-status-dashboard:
    image: ghcr.io/jbkunama1/hai.chrony-status-dashboard:latest
    build: .
    container_name: chrony-status-dashboard
    restart: unless-stopped
    ports:
      - "1234:1234"
    networks:
      - highfishnetwork

networks:
  highfishnetwork:
    driver: bridge

# Host-Netzwerk: Zugriff auf chronyc vom Host

